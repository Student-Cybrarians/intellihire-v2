<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntelliHire Assessment</title><link rel="stylesheet" href="/static/module2.css"></head><body><main><section class="panel"><p class="eyebrow">ADAPTIVE ASSESSMENT</p><p>Question {{ progress + 1 }} of {{ total }}</p><h1>{{ question.prompt }}</h1><p>Current ability θ: <strong>{{ '%.2f'|format(ability) }}</strong></p><form method="post"><input type="hidden" name="question_id" value="{{ question.id }}">{% for option in question.options %}<p><label><input type="radio" name="answer" value="{{ loop.index0 }}" required> {{ option }}</label></p>{% endfor %}<button type="submit">Submit Answer</button></form></section></main></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox · IntelliHire Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.1.0/dist/css/adminlte.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"></head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary"><div class="app-wrapper">
<nav class="app-header navbar navbar-expand bg-body"><div class="container-fluid"><a class="navbar-brand fw-bold" href="/admin">✦ IntelliHire Admin</a><div class="ms-auto"><a class="btn btn-outline-secondary btn-sm" href="/auth/logout">Sign out</a></div></div></nav>
<main class="app-main"><div class="app-content p-3 p-lg-4"><div class="container-fluid"><div class="row g-3">
<div class="col-lg-4"><div class="card card-primary card-outline h-100"><div class="card-header"><h3 class="card-title"><i class="bi bi-inbox me-2"></i>Support Inbox</h3></div><div class="card-body p-0"><div class="p-2 border-bottom"><select id="statusFilter" class="form-select form-select-sm" onchange="loadConversations()"><option value="">All statuses</option><option>OPEN</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select></div><div id="conversationList" class="list-group list-group-flush"></div></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-header"><div><h3 id="chatTitle" class="card-title">Select a conversation</h3><div id="chatUser" class="small text-secondary"></div></div><div class="ms-auto d-flex gap-2"><select id="status" class="form-select form-select-sm" style="width:150px"><option>OPEN</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option></select><select id="priority" class="form-select form-select-sm" style="width:120px"><option>LOW</option><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select><button class="btn btn-sm btn-primary" onclick="saveState()">Save</button></div></div><div class="card-body"><div id="messages" class="border rounded p-3" style="height:500px;overflow:auto;background:#f8f9fa"></div><form id="replyForm" class="input-group mt-3"><input id="reply" class="form-control" maxlength="8000" placeholder="Reply to the user..."><button class="btn btn-primary">Reply</button></form></div></div></div>
</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/admin-lte@4.1.0/dist/js/adminlte.min.js"></script>
<script>
let active=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json();}
async function loadConversations(){const q=statusFilter.value?('?status='+encodeURIComponent(statusFilter.value)):'';const d=await api('/auth/support/api/conversations'+q);conversationList.innerHTML=d.conversations.length?d.conversations.map(c=>`<button class="list-group-item list-group-item-action ${active===c.id?'active':''}" onclick="openChat('${c.id}')"><div class="d-flex justify-content-between"><strong>${esc(c.subject)}</strong><span class="badge text-bg-${c.priority==='URGENT'?'danger':c.priority==='HIGH'?'warning':'secondary'}">${esc(c.priority)}</span></div><div class="small">${esc(c.user_name||c.user_email)} · ${esc(c.status)}</div><small>${c.message_count} messages · ${new Date(c.last_message_at).toLocaleString()}</small></button>`).join(''):'<div class="p-4 text-secondary">No matching conversations.</div>'}
async function openChat(id){active=id;const d=await api('/auth/support/api/conversations/'+id);chatTitle.textContent=d.conversation.subject;chatUser.textContent=d.conversation.user_name+' · '+d.conversation.user_email;status.value=d.conversation.status;priority.value=d.conversation.priority;messages.innerHTML=d.messages.map(m=>`<div class="mb-3"><div class="small text-secondary"><strong>${esc(m.sender_name)}</strong> · ${esc(m.sender_role)} · ${new Date(m.created_at).toLocaleString()}</div><div class="p-2 rounded ${m.sender_role==='ADMIN'?'bg-primary text-white':'bg-white border'}">${esc(m.body).replace(/\n/g,'<br>')}</div></div>`).join('');messages.scrollTop=messages.scrollHeight;loadConversations()}
async function saveState(){if(!active)return;try{await api('/auth/support/api/conversations/'+active,{method:'PATCH',body:JSON.stringify({status:status.value,priority:priority.value})});openChat(active)}catch(x){alert(x.message)}}
replyForm.onsubmit=async e=>{e.preventDefault();if(!active||!reply.value.trim())return;try{await api('/auth/support/api/conversations/'+active+'/messages',{method:'POST',body:JSON.stringify({body:reply.value})});reply.value='';openChat(active)}catch(x){alert(x.message)}};
loadConversations();setInterval(()=>{loadConversations();if(active)openChat(active)},15000);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IntelliHire — Module 3</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1000px;margin:auto;padding:32px}button,textarea,input{font:inherit}textarea{width:100%;min-height:180px;background:#11182b;color:#fff;border:1px solid #334;padding:14px}button{padding:12px 18px;margin:8px 4px 8px 0;cursor:pointer}.card{background:#121a2e;padding:24px;border-radius:16px;margin:16px 0}.metric{display:inline-block;margin:8px 18px 8px 0;font-size:20px}</style></head><body><main><a href="/" style="color:#9cc">← Dashboard</a><h1>Module 3 · Technical Interview</h1><div class="card"><div id="q">Starting interview…</div><textarea id="answer" placeholder="Explain your approach, algorithms, trade-offs, testing and complexity…"></textarea><button onclick="submitAnswer()">Submit Answer</button><button onclick="finish()">Finish Interview</button></div><div class="card"><div class="metric">Progress: <b id="progress">0/3</b></div><div class="metric">Score: <b id="score">—</b></div><div id="feedback"></div></div></main><script>let sid=null,question=null;async function start(){let r=await fetch('/api/module3/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'Software Engineer'})});let d=await r.json();sid=d.session.id;question=d.question;render()}function render(){document.querySelector('#q').innerHTML='<b>'+question.difficulty.toUpperCase()+' · '+question.topic+'</b><p>'+question.prompt+'</p>'}async function submitAnswer(){let text=document.querySelector('#answer').value.trim();if(!text)return;let r=await fetch('/api/module3/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,answer:text})});let d=await r.json();document.querySelector('#score').textContent=d.evaluation.score;document.querySelector('#feedback').textContent='Concepts identified: '+d.evaluation.concept_hits;document.querySelector('#answer').value='';if(d.next){question=d.next;document.querySelector('#progress').textContent='next';render()}else{document.querySelector('#q').textContent='All questions answered. Finish to see report.'}}async function finish(){let r=await fetch('/api/module3/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})});let d=await r.json();document.querySelector('#score').textContent=d.score;document.querySelector('#q').innerHTML='<h2>Technical interview complete</h2><p>'+d.questions_answered+' questions evaluated.</p>'}start()</script></body></html>

name: AI Test Diagnostics
on:
  push:
    branches: [master-branch]
    paths: ['ai/**','tests/test_ai_orchestrator.py']
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest
      - name: Run focused AI tests
        run: |
          set +e
          PYTHONPATH=. pytest -q tests/test_ai_orchestrator.py tests/test_module1_ai.py tests/test_module4_liftoff.py > ai-test-report.txt 2>&1
          echo $? > ai-test-exit.txt
          exit 0
      - name: Commit diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-test-report.txt ai-test-exit.txt
          git commit -m 'Record AI test diagnostics [skip ci]' || true
          git push || true

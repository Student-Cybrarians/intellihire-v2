name: Apply IntelliHire AI Integration
on:
  push:
    branches: [master-branch]
    paths:
      - 'scripts/apply_ai_integration.py'
      - '.github/workflows/apply-ai-integration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_ai_integration.py
      - run: python -m py_compile app.py ai/providers.py ai/orchestrator.py ai/context.py ai/schemas.py ai_routes.py module1_ai.py module3_routes.py module4_liftoff.py module5_routes.py research_retrieval.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py module1_ai.py module3_routes.py module4_liftoff.py module5_routes.py research_retrieval.py
          git diff --cached --quiet || git commit -m 'Wire central DeepSeek AI orchestrator [skip ci]'
          git push

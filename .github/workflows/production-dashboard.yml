name: IntelliHire Production Smoke
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed IntelliHire URL to verify'
        required: true
        type: string
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          BASE_URL="${BASE_URL%/}"
          for path in / /about /features /contact /pricing /faq /courses /auth/google; do
            code=$(curl -L -sS -o /tmp/page -w '%{http_code}' "$BASE_URL$path" || true)
            echo "$path HTTP: $code"
            test "$code" = "200"
            grep -qi "INTELLIHIRE" /tmp/page
          done

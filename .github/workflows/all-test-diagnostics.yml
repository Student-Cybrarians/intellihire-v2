name: All Test Diagnostics
on:
  push:
    branches: [master-branch]
    paths: ['tests/**']
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt pytest
      - name: Run all tests
        run: |
          set +e
          PYTHONPATH=. pytest -q tests > all-test-report.txt 2>&1
          echo $? > all-test-exit.txt
          exit 0
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-test-report.txt all-test-exit.txt
          git commit -m 'Record full test diagnostics [skip ci]' || true
          git push || true

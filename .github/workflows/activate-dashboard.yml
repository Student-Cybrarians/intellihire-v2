name: Activate dashboard
on:
  push:
    branches: [master-branch]
    paths-ignore:
      - '.github/workflows/activate-dashboard.yml'
      - 'templates/dashboard.html'
jobs:
  wire-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-branch
          fetch-depth: 0
      - name: Wire dashboard template
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          old="return render_template_string(DASH_HTML,user=user)"
          new="return render_template('dashboard.html', user=user)"
          if old not in s:
              raise SystemExit('dashboard route contract not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify Python syntax
        run: python -m py_compile app.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Wire candidate dashboard template [skip ci]'
          git push origin master-branch

name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/oc')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/oc')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '/opencode')) ||
      (github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.body, '/oc')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned') ||
      (github.event_name == 'pull_request_review' && github.event.action == 'submitted' && contains(github.event.review.body, '/opencode')) ||
      (github.event_name == 'pull_request_review' && github.event.action == 'submitted' && contains(github.event.review.body, '/oc'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

name: IntelliHire Production Gates
on:
  push:
    branches: [master-branch]
  pull_request:
    branches: [master-branch]
jobs:
  frontend-production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

name: IntelliHire Tests
on:
  push:
    branches: [master-branch]
  pull_request:
    branches: [master-branch]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile module1_ai.py auth_routes.py app.py career_intelligence.py career_twin_store.py research_engine.py research_store.py module5_routes.py
      - run: PYTHONPATH=. pytest -q tests
